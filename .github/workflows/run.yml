name: 刷步数

on:
  schedule:
    # 这里的 0 17 代表 UTC 时间下午 17 点（对应北京时间第二天凌晨 1 点）
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: Init Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 👇 随机延迟步骤 (控制在 0-5 分钟内)
      - name: Random Delay (随机延迟)
        run: |
          # 随机生成 0 到 300 秒（即 0 到 5 分钟）的延迟时间
          DELAY=$(( RANDOM % 300 ))
          echo "本次任务将随机等待 ${DELAY} 秒 (约 $(( DELAY / 60 )) 分钟) 后执行..."
          sleep $DELAY
          
      - name: Start
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py
